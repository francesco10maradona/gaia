<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f4f2">
<title>Per Gaia ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient"></div>
<div class="hearts" aria-hidden="true"></div>

<main class="app">

<section class="screen active" id="screen1">
  <div class="eyebrow">PER GAIA</div>
  <h1>Per cena…</h1>
  <p class="subtitle">Cosa vuoi che ti prepari quando torni? 🤍</p>

  <div class="card">
    <textarea id="dinner" maxlength="500" placeholder="Scrivimi qui cosa vorresti mangiare…"></textarea>
    <div class="counter"><span id="count">0</span>/500</div>
  </div>

  <button class="primary" id="dinnerNext">Ho deciso <span>→</span></button>
</section>

<section class="screen" id="screen2">
  <button class="back" id="backToDinner">←</button>
  <div class="eyebrow">QUANDO CI VEDIAMO</div>
  <h1>Cosa vuoi fare<br>appena ci vediamo?</h1>
  <p class="subtitle">Scegli quello che ti va di più. ❤️</p>

  <div class="elegant-choices">
    <button class="elegant-choice" data-choice="Amore">
      <div class="choice-icon">♡</div>
      <div class="choice-copy">
        <strong>Amore</strong>
        <span>Solo noi due, finalmente.</span>
      </div>
      <div class="choice-check">✓</div>
    </button>

    <button class="elegant-choice" data-choice="Coccole e Patrick">
      <div class="choice-icon paw">♡</div>
      <div class="choice-copy">
        <strong>Coccole e Patrick</strong>
        <span>Coccole, sorrisi e il nostro piccolo complice.</span>
      </div>
      <div class="choice-check">✓</div>
    </button>

    <button class="elegant-choice special" data-choice="Amore, coccole e Patrick">
      <div class="choice-icon">♥</div>
      <div class="choice-copy">
        <strong>Amore, coccole e Patrick</strong>
        <span>Praticamente tutto quello che ci manca.</span>
      </div>
      <div class="choice-check">✓</div>
    </button>
  </div>

  <button class="primary" id="finish">Ho scelto <span>→</span></button>
</section>

<section class="screen" id="screen3">
  <div class="final-heart">♥</div>
  <div class="eyebrow">PER TE</div>
  <h1>Allora ho già<br>capito tutto…</h1>
  <p class="final-text" id="finalText"></p>

  <div class="summary">
    <div>
      <small>PER CENA</small>
      <p id="dinnerResult">—</p>
    </div>
    <div>
      <small>APPENA CI VEDIAMO</small>
      <p id="choicesResult">—</p>
    </div>
  </div>

  <button class="secondary" id="restart">Ricomincia</button>
  <p class="tiny">Fatto con amore, apposta per te.</p>
</section>

</main>
<script src="script.js"></script>
</body>
</html>
