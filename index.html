<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#170b2d">

<title>Per Gaia ❤️</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: #170b2d;
}

button {
    font: inherit;
}

.app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
}

/* =========================================================
   SFONDO
========================================================= */

.background {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 5%,
            rgba(255,130,190,.38),
            transparent 34%
        ),
        radial-gradient(
            circle at 15% 75%,
            rgba(100,70,190,.28),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #12082a 0%,
            #27113f 42%,
            #71385f 76%,
            #e8899c 100%
        );
}

.stars {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.5) 1px,
            transparent 1.5px
        );

    background-size: 70px 70px, 120px 120px;

    animation: starsMove 30s linear infinite;
    opacity: .8;
}

@keyframes starsMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(80px);
    }
}

.moon {
    position: absolute;
    top: 7%;
    right: 8%;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #fff3d2;

    box-shadow:
        0 0 35px rgba(255,240,190,.8);
}


/* =========================================================
   GATTINI
========================================================= */

.cats {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

.cat {
    position: absolute;

    font-size: 38px;

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.25)
        );
}

.cat.a {
    left: -70px;
    top: 18%;
    animation: walkRight 14s linear infinite;
}

.cat.b {
    right: -70px;
    top: 38%;
    animation: walkLeft 17s linear infinite;
}

.cat.c {
    left: 8%;
    bottom: 15%;
    animation: float 4s ease-in-out infinite;
}

.cat.d {
    right: 8%;
    bottom: 22%;
    animation: float 5s ease-in-out infinite;
}

@keyframes walkRight {
    from {
        transform: translateX(0);
    }

    to {
        transform:
            translateX(calc(100vw + 150px));
    }
}

@keyframes walkLeft {
    from {
        transform:
            translateX(0)
            scaleX(-1);
    }

    to {
        transform:
            translateX(calc(-100vw - 150px))
            scaleX(-1);
    }
}

@keyframes float {
    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}


/* =========================================================
   SCHERMATE
========================================================= */

.screen {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    opacity: 0;
    visibility: hidden;

    transition: opacity .7s ease;
}

.screen.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   INTRO
========================================================= */

.intro {
    position: relative;
    z-index: 20;

    width: min(100%, 420px);

    text-align: center;
}

.crown {
    font-size: 50px;

    animation:
        crownFloat
        3s
        ease-in-out
        infinite;
}

@keyframes crownFloat {
    0%,
    100% {
        transform:
            translateY(0)
            rotate(-3deg);
    }

    50% {
        transform:
            translateY(-10px)
            rotate(3deg);
    }
}

.intro h1 {
    margin: 5px 0 0;

    font-family: Georgia, serif;

    font-size:
        clamp(
            58px,
            18vw,
            82px
        );

    line-height: .9;

    letter-spacing: -4px;
}

.intro h1 span {
    color: #ff82b4;
}

.card {
    width: min(100%, 370px);

    margin: 30px auto 0;

    padding: 28px 20px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid
        rgba(255,255,255,.18);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.3);
}

.question {
    font-family: Georgia, serif;
    font-size: 31px;
}

.subtitle {
    margin-top: 9px;

    color:
        rgba(255,255,255,.7);

    font-size: 14px;
}

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 14px;

    margin-top: 25px;
}

.btn {
    min-width: 125px;
    min-height: 58px;

    padding: 14px 22px;

    border: 0;
    border-radius: 999px;

    font-size: 17px;
    font-weight: 800;

    color: white;

    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}

.yes {
    background:
        linear-gradient(
            135deg,
            #ff397d,
            #ff78ac
        );

    box-shadow:
        0 8px 30px
        rgba(255,45,115,.45);

    animation:
        pulse
        2s
        ease-in-out
        infinite;
}

@keyframes pulse {
    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }
}


/* =========================================================
   NO
========================================================= */

.no {
    position: relative;

    z-index: 1000;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid
        rgba(255,255,255,.25);

    color: white;

    touch-action: none;

    /*
       Movimento più morbido.
       Niente transizione su left/top:
       evita l'effetto "ballerino".
    */
    transition:
        transform .12s ease-out;
}


/* =========================================================
   FINALE
========================================================= */

.final-bg {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            #1c0c3c 0%,
            #623460 43%,
            #e98c9e 68%,
            #f5c38f 100%
        );
}

.sun {
    position: absolute;

    top: 12%;
    left: 50%;

    transform: translateX(-50%);

    width: 145px;
    height: 145px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffbdc 0%,
            #ffd28d 50%,
            transparent 72%
        );
}

.ocean {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 40%;

    background:
        linear-gradient(
            180deg,
            #36a4ae,
            #126c80
        );

    clip-path:
        polygon(
            0 17%,
            12% 10%,
            25% 17%,
            40% 10%,
            55% 17%,
            70% 9%,
            85% 17%,
            100% 10%,
            100% 100%,
            0 100%
        );
}

.final-title {
    position: absolute;

    top: 5%;
    left: 0;

    width: 100%;

    z-index: 50;

    text-align: center;
}

.final-title h2 {
    margin: 0;
    padding: 0 15px;

    font-family: Georgia, serif;

    font-size:
        clamp(
            27px,
            8vw,
            44px
        );

    text-shadow:
        0 3px 15px
        rgba(0,0,0,.25);
}

.final-title p {
    margin-top: 8px;

    color: #ffe0eb;

    font-size: 14px;
}


/* =========================================================
   PALME
========================================================= */

.palm {
    position: absolute;

    bottom: 19%;

    z-index: 6;

    font-size: 130px;
}

.palm.left {
    left: -28px;
    transform: rotate(-10deg);
}

.palm.right {
    right: -28px;

    transform:
        scaleX(-1)
        rotate(-10deg);
}


/* =========================================================
   COPPIA
========================================================= */

.couple {
    position: absolute;

    left: 50%;
    top: 27%;

    width: 300px;
    height: 330px;

    transform:
        translateX(-50%);

    z-index: 30;
}

.prince,
.gaia {
    position: absolute;

    bottom: 0;

    width: 130px;
    height: 300px;
}


/* =========================================================
   PRINCIPE
========================================================= */

.prince {
    left: 0;
}

.prince .head {
    position: absolute;

    top: 0;
    left: 30px;

    width: 70px;
    height: 78px;

    border-radius:
        48% 48% 46% 46%;

    background:
        linear-gradient(
            135deg,
            #f0b18d,
            #db8f6c
        );

    z-index: 5;
}

.prince .head::before {
    content: "";

    position: absolute;

    top: -13px;
    left: -4px;

    width: 78px;
    height: 45px;

    border-radius:
        55% 55% 30% 30%;

    background:
        linear-gradient(
            135deg,
            #251715,
            #58301f
        );

    z-index: -1;
}

.eye {
    position: absolute;

    top: 35px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #34202a;
}

.eye.left {
    left: 17px;
}

.eye.right {
    right: 17px;
}

.smile {
    position: absolute;

    top: 53px;
    left: 27px;

    width: 16px;
    height: 7px;

    border-bottom:
        2px solid
        #914b5e;

    border-radius: 50%;
}

.prince .body {
    position: absolute;

    top: 73px;
    left: 15px;

    width: 100px;
    height: 125px;

    border-radius:
        35px 35px 12px 12px;

    background:
        linear-gradient(
            90deg,
            #183875,
            #5586d5,
            #19346d
        );
}

.prince .body::before {
    content: "";

    position: absolute;

    left: 42px;
    top: 0;

    width: 16px;
    height: 120px;

    background: #f0ce78;
}

.prince .arm {
    position: absolute;

    top: 88px;
    right: 0;

    width: 18px;
    height: 100px;

    border-radius: 20px;

    background: #e5a07c;

    transform: rotate(-22deg);

    z-index: 10;
}

.prince .hand {
    position: absolute;

    right: -5px;
    top: 165px;

    width: 23px;
    height: 23px;

    border-radius: 50%;

    background: #e5a07c;

    z-index: 20;
}


/* =========================================================
   GAIA - CORPO
========================================================= */

.gaia {
    right: 0;
}

.gaia .body {
    position: absolute;

    top: 78px;
    left: 5px;

    width: 120px;
    height: 150px;

    background:
        linear-gradient(
            90deg,
            #713c69 0%,
            #d88bb2 32%,
            #f0b9d3 50%,
            #d88bb2 68%,
            #713c69 100%
        );

    clip-path:
        polygon(
            32% 0,
            68% 0,
            100% 100%,
            0 100%
        );

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.2);
}

.gaia .body::before {
    content: "";

    position: absolute;

    top: 0;
    left: 38px;

    width: 44px;
    height: 45px;

    background: #f4d4e3;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );
}

.gaia .body::after {
    content: "🌺";

    position: absolute;

    bottom: 22px;
    left: 50%;

    transform:
        translateX(-50%);

    font-size: 22px;
}


/* =========================================================
   NUOVO VOLTO DI GAIA
========================================================= */

/*
   Il volto ora è più stretto e ovale.
   I capelli sono separati dal viso e cadono
   ai lati come una vera acconciatura.
*/

.gaia .head {
    position: absolute;

    top: 0;
    left: 30px;

    width: 72px;
    height: 84px;

    border-radius:
        47% 47% 50% 50%;

    background:
        linear-gradient(
            135deg,
            #f8c9a9 0%,
            #f3b795 45%,
            #e5a17f 100%
        );

    z-index: 10;

    /*
       Leggera ombra sotto il mento
    */
    box-shadow:
        inset
        -4px -5px 8px
        rgba(140,65,45,.10);
}


/*
   CAPELLI PRINCIPALI
*/

.gaia .head::before {
    content: "";

    position: absolute;

    top: -19px;
    left: -25px;

    width: 122px;
    height: 132px;

    border-radius:
        52% 48% 45% 50%;

    background:
        linear-gradient(
            100deg,
            #3d2118 0%,
            #684024 27%,
            #8a6235 48%,
            #70451f 67%,
            #3e2118 100%
        );

    z-index: -2;

    box-shadow:
        3px 8px 10px
        rgba(35,15,10,.22);
}


/*
   APERTURA DEI CAPELLI:
   lascia il viso scoperto al centro
*/

.gaia .head::after {
    content: "";

    position: absolute;

    top: -8px;
    left: -17px;

    width: 106px;
    height: 110px;

    border-left:
        17px solid
        #633b21;

    border-right:
        17px solid
        #633b21;

    border-bottom:
        13px solid
        #5a351e;

    border-radius:
        48% 48% 45% 45%;

    z-index: -1;

    /*
       I capelli rimangono dietro il viso
    */
}


/*
   Ciocche frontali leggere
*/

.gaia .hair-lock-left,
.gaia .hair-lock-right {
    position: absolute;

    top: 12px;

    width: 17px;
    height: 75px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            #422319,
            #79502c
        );

    z-index: 15;
}

.gaia .hair-lock-left {
    left: -14px;

    transform:
        rotate(10deg);
}

.gaia .hair-lock-right {
    right: -14px;

    transform:
        rotate(-10deg);
}


/*
   OCCHI GAIA
*/

.gaia .eye {
    position: absolute;

    top: 38px;

    width: 10px;
    height: 8px;

    border-radius:
        50%;

    background:
        #493039;

    z-index: 20;
}

.gaia .eye::after {
    content: "";

    position: absolute;

    top: 1px;
    left: 2px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;
}

.gaia .eye.left {
    left: 15px;
}

.gaia .eye.right {
    right: 15px;
}


/*
   SOPRACCIGLIA
*/

.gaia .eye.left::before,
.gaia .eye.right::before {
    content: "";

    position: absolute;

    top: -8px;

    width: 14px;
    height: 3px;

    border-radius: 50%;

    background:
        #694124;
}

.gaia .eye.left::before {
    left: -2px;

    transform:
        rotate(-8deg);
}

.gaia .eye.right::before {
    right: -2px;

    transform:
        rotate(8deg);
}


/*
   NASO
*/

.gaia .nose {
    position: absolute;

    top: 46px;
    left: 33px;

    width: 7px;
    height: 10px;

    border-right:
        1px solid
        rgba(150,70,55,.35);

    border-bottom:
        1px solid
        rgba(150,70,55,.35);

    border-radius: 0 0 5px 0;

    z-index: 20;
}


/*
   SORRISO
*/

.gaia .smile {
    position: absolute;

    top: 58px;
    left: 27px;

    width: 19px;
    height: 9px;

    border-bottom:
        2px solid
        #a94f64;

    border-radius:
        0 0 50% 50%;

    z-index: 20;
}


/*
   PICCOLO ROSSETTO
*/

.gaia .lips {
    position: absolute;

    top: 57px;
    left: 28px;

    width: 17px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(190,80,105,.30);

    z-index: 19;
}


/* =========================================================
   CORONA
========================================================= */

.crown-small {
    position: absolute;

    top: -30px;
    left: 17px;

    z-index: 60;

    font-size: 29px;

    filter:
        drop-shadow(
            0 2px 4px
            rgba(0,0,0,.2)
        );
}


/* =========================================================
   COLLANA
========================================================= */

.gaia .necklace {
    position: absolute;

    top: 70px;
    left: 52px;

    width: 28px;
    height: 12px;

    border-bottom:
        2px solid
        #f5d078;

    border-radius: 50%;

    z-index: 20;
}


/* =========================================================
   BRACCIO GAIA
========================================================= */

.gaia .arm {
    position: absolute;

    top: 91px;
    left: 0;

    width: 18px;
    height: 100px;

    border-radius: 20px;

    background: #e9a27f;

    transform: rotate(22deg);

    z-index: 10;
}

.gaia .hand {
    position: absolute;

    left: -6px;
    top: 169px;

    width: 23px;
    height: 23px;

    border-radius: 50%;

    background: #e9a27f;

    z-index: 20;
}


/* =========================================================
   MANI
========================================================= */

.holding {
    position: absolute;

    left: 123px;
    top: 174px;

    width: 45px;
    height: 11px;

    border-radius: 10px;

    background: #e5a07c;

    z-index: 25;
}


/* =========================================================
   GAMBE
========================================================= */

.leg {
    position: absolute;

    top: 198px;

    width: 25px;
    height: 95px;

    border-radius: 20px;
}

.prince .leg {
    background: #26325b;
}

.gaia .leg {
    background: #824d73;
}

.prince .leg.left,
.gaia .leg.left {
    left: 32px;
}

.prince .leg.right,
.gaia .leg.right {
    right: 32px;
}


/* =========================================================
   FIORE
========================================================= */

.flower {
    position: absolute;

    top: 2px;
    right: -4px;

    z-index: 70;

    font-size: 23px;
}


/* =========================================================
   PRINCIPESSE
========================================================= */

.princesses {
    position: absolute;

    inset: 20% 0 15%;

    z-index: 20;

    pointer-events: none;
}

.princess {
    position: absolute;

    font-size: 40px;

    animation:
        float
        3.5s
        ease-in-out
        infinite;
}

.princess.p1 {
    left: 4%;
    top: 13%;
}

.princess.p2 {
    left: 25%;
    top: 3%;

    animation-delay: .5s;
}

.princess.p3 {
    right: 25%;
    top: 3%;

    animation-delay: 1s;
}

.princess.p4 {
    right: 4%;
    top: 13%;

    animation-delay: 1.5s;
}

.princess.p5 {
    left: 2%;
    top: 50%;

    animation-delay: .7s;
}

.princess.p6 {
    right: 2%;
    top: 50%;

    animation-delay: 1.2s;
}


/* =========================================================
   MESSAGGIO
========================================================= */

.message {
    position: absolute;

    left: 50%;
    bottom: 3%;

    transform:
        translateX(-50%);

    width:
        min(88%, 400px);

    padding: 16px 18px;

    border-radius: 25px;

    background:
        rgba(35,20,55,.5);

    border:
        1px solid
        rgba(255,255,255,.2);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    z-index: 60;

    text-align: center;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.message strong {
    display: block;

    font-family: Georgia, serif;

    font-size: 23px;
}

.message span {
    display: block;

    margin-top: 6px;

    color: #ffd3e2;

    font-size: 17px;
}


/* =========================================================
   CUORI
========================================================= */

.heart {
    position: fixed;

    left: 50%;
    top: 50%;

    z-index: 500;

    pointer-events: none;

    font-size: 25px;

    animation:
        explode
        1.8s
        ease-out
        forwards;
}

@keyframes explode {
    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r))
            scale(1.5);
    }
}


/* =========================================================
   FLASH
========================================================= */

.flash {
    position: fixed;
    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 1000;
}

.flash.active {
    animation:
        flash
        .8s
        ease;
}

@keyframes flash {
    0% {
        opacity: 0;
    }

    25% {
        opacity: .8;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-height: 700px) {

    .card {
        margin-top: 18px;
        padding: 22px;
    }

    .couple {
        top: 25%;

        transform:
            translateX(-50%)
            scale(.86);
    }

    .message {
        bottom: 2%;
        padding: 13px;
    }
}

@media (max-width: 360px) {

    .btn {
        min-width: 108px;
    }

    .couple {
        transform:
            translateX(-50%)
            scale(.78);
    }

    .princess {
        font-size: 32px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         SFONDO
    ====================================================== -->

    <div class="background"></div>
    <div class="stars"></div>
    <div class="moon"></div>


    <!-- =====================================================
         GATTINI
    ====================================================== -->

    <div class="cats">

        <div class="cat a">🐱</div>

        <div class="cat b">🐈</div>

        <div class="cat c">😺</div>

    <!-- =====================================================

        <!-- =================================================

                "
            >

                class="cat"
                style="
                    left:31%;

                    font-size:30px;
                    animation:
                        float
                        4.5s
                        ease-in-out
                        infinite;
                "
            >
                😻
            </div>

            <div
                class="cat"
                style="
                    right:31%;
                    bottom:19%;
                    font-size:30px;
                    animation:
                        float
                        5.5s
                        ease-in-out

                "
            >

        <!-- =================================================
             MESSAGGIO
        ================================================== -->

        <div class="message">

            <strong>
                Gaia, sei la mia vita.
            </strong>

                Ti amo ❤️
            </span>

        </div>

    </section>


    <div
        class="flash"
        id="flash"
    ></div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const TRACKING_URL =
"https://script.google.com/macros/s/AKfycbwyEZmVVyPM4Hyf--70oShW_L7Svwf8SiyHGxWh34FaFf0Tx8rORyEj7fwpR-Stc3uw/exec";


/* =========================================================
   ID VISITA
========================================================= */

const visitId =
    Date.now().toString(36)
    +
    "-"
    +
    Math.random()
        .toString(36)
        .substring(2);


/* =========================================================
   REGISTRA EVENTO
========================================================= */

function trackEvent(eventName) {

    const data = {

        event: eventName,

        visitId: visitId,

        page: window.location.href

    };


    fetch(
        TRACKING_URL,
        {
            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type":
                    "text/plain;charset=UTF-8"
            },

            body:
                JSON.stringify(data),

            keepalive: true
        }
    )
    .catch(function() {});
}


/* =========================================================
   ELEMENTI
========================================================= */

const yes =
    document.getElementById("yes");

const no =
    document.getElementById("no");

const start =
    document.getElementById("start");

const final =
    document.getElementById("final");

const flash =
    document.getElementById("flash");


let noCount = 0;


/* =========================================================
   NO - MOVIMENTO FLUIDO
========================================================= */

function moveNo(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }


    noCount++;


    trackEvent("NO");


    /*
       Passiamo a fixed solo quando
       comincia a scappare.
    */

    no.style.position = "fixed";


    const rect =
        no.getBoundingClientRect();


    const width =
        rect.width;

    const height =
        rect.height;


    /*
       Area sicura.
       Evitiamo che il pulsante finisca
       sotto i bordi dello schermo.
    */

    const margin = 18;


    const maxX =
        Math.max(
            margin,
            window.innerWidth -
            width -
            margin
        );


    const maxY =
        Math.max(
            margin,
            window.innerHeight -
            height -
            margin
        );


    const x =
        margin
        +
        Math.random()
        *
        Math.max(
            1,
            maxX - margin
        );


    const y =
        margin
        +
        Math.random()
        *
        Math.max(
            1,
            maxY - margin
        );


    /*
       Usiamo transform per il piccolo
       movimento finale invece di animare
       left/top.
    */

    no.style.left =
        x + "px";

    no.style.top =
        y + "px";


    const rotation =
        Math.random()
        * 10
        - 5;


    no.style.transform =
        "translate3d(0,0,0) rotate("
        +
        rotation
        +
        "deg)";


    const messages = [

        "NO 😈",

        "Sicura? 🥺",

        "Dai Gaia ❤️",

        "Riprova 😂",

        "Non mi prendi 😈",

        "Quasi! 😂",

        "Daiii 🥹",

        "NOOO ❤️",

        "AHAHAHA 😂",

        "Ancora?!",

        "Mai 😈",

        "Prendimi!",

        "Ops 👀",

        "Ti amo comunque ❤️",

        "Sei vicina!",

        "🥹❤️"

    ];


    no.textContent =
        messages[
            noCount %
            messages.length
        ];
}


/* =========================================================
   MOUSE
========================================================= */

no.addEventListener(
    "mouseenter",
    moveNo
);


/* =========================================================
   TOUCH
========================================================= */

no.addEventListener(
    "touchstart",
    moveNo,
    {
        passive: false
    }
);


/* =========================================================
   CLICK
========================================================= */

no.addEventListener(
    "click",
    moveNo
);


/* =========================================================
   CUORI
========================================================= */

function createHeart() {

    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💘",
        "💞",
        "✨"
    ];


    heart.textContent =
        hearts[
            Math.floor(
                Math.random()
                *
                hearts.length
            )
        ];


    heart.style.setProperty(
        "--x",

        (
            Math.random()
            * 600
            - 300
        ) + "px"
    );


    heart.style.setProperty(
        "--y",

        (
            -Math.random()
            * 700
            - 100
        ) + "px"
    );


    heart.style.setProperty(
        "--r",

        (
            Math.random()
            * 120
            - 60
        ) + "deg"
    );


    document.body.appendChild(
        heart
    );


    setTimeout(
        function() {
            heart.remove();
        },
        1900
    );
}


/* =========================================================
   SI
========================================================= */

yes.addEventListener(
    "click",
    function() {

        trackEvent("SI");


        yes.disabled = true;


        for (
            let i = 0;
            i < 80;
            i++
        ) {

            setTimeout(
                createHeart,
                i * 15
            );

        }


        flash.classList.add(
            "active"
        );


        setTimeout(
            function() {

                flash.classList.remove(
                    "active"
                );

            },
            800
        );


        start.classList.remove(
            "active"
        );


        setTimeout(
            function() {

                final.classList.add(
                    "active"
                );

            },
            600
        );

    }
);


/* =========================================================
   CUORI AUTOMATICI
========================================================= */

setInterval(
    function() {

        if (
            final.classList.contains(
                "active"
            )
        ) {

            createHeart();

        }

    },
    1400
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            no.style.position
            !==
            "fixed"
        ) {
            return;
        }


        const rect =
            no.getBoundingClientRect();


        const margin = 18;


        let x =
            rect.left;

        let y =
            rect.top;


        if (
            x + rect.width
            >
            window.innerWidth -
            margin
        ) {

            x =
                window.innerWidth
                -
                rect.width
                -
                margin;

        }


        if (
            y + rect.height
            >
            window.innerHeight -
            margin
        ) {

            y =
                window.innerHeight
                -
                rect.height
                -
                margin;

        }


        if (x < margin) {
            x = margin;
        }


        if (y < margin) {
            y = margin;
        }


        no.style.left =
            x + "px";

        no.style.top =
            y + "px";

    }
);

</script>

</body>
</html>
