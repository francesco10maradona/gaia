<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Per Gaia ❤️</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#100b25;
    color:white;
}

button{
    font:inherit;
}

.app{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
}

.sky{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 15%,rgba(255,154,205,.45),transparent 35%),
        linear-gradient(180deg,#170e35 0%,#29153f 40%,#5b2858 68%,#e4779d 100%);
}

.stars{
    position:absolute;
    inset:0;
    opacity:.8;
    background-image:
        radial-gradient(circle,white 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.5px);
    background-size:73px 73px,127px 127px;
    background-position:10px 15px,45px 60px;
    animation:starsMove 25s linear infinite;
}

@keyframes starsMove{
    from{transform:translateY(0)}
    to{transform:translateY(80px)}
}

.moon{
    position:absolute;
    top:7%;
    right:9%;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#fff4d6;
    box-shadow:
        0 0 25px rgba(255,239,190,.7),
        0 0 70px rgba(255,205,220,.25);
}

.moon:after{
    content:"";
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#1c1038;
    left:18px;
    top:-5px;
}

.screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    visibility:hidden;
    transform:scale(1.06);
    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.22,1,.36,1);
}

.screen.active{
    opacity:1;
    visibility:visible;
    transform:scale(1);
}

.intro{
    width:min(100%,430px);
    text-align:center;
    position:relative;
    z-index:20;
}

.crown{
    font-size:48px;
    animation:crownFloat 3s ease-in-out infinite;
    filter:drop-shadow(0 5px 15px rgba(255,180,220,.4));
}

@keyframes crownFloat{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-10px) rotate(3deg)}
}

.intro h1{
    margin:10px 0 0;
    font-family:Georgia,serif;
    font-size:clamp(54px,16vw,78px);
    line-height:.95;
    letter-spacing:-3px;
    text-shadow:0 5px 25px rgba(0,0,0,.25);
}

.intro h1 span{
    color:#ff8fb8;
}

.question-card{
    margin:28px auto 0;
    padding:25px 20px;
    width:min(100%,370px);
    border-radius:32px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.17);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 20px 60px rgba(0,0,0,.2),
        inset 0 1px rgba(255,255,255,.15);
}

.question{
    font-family:Georgia,serif;
    font-size:31px;
}

.question-sub{
    margin-top:9px;
    color:rgba(255,255,255,.68);
    font-size:14px;
}

.buttons{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-top:25px;
}

.btn{
    border:0;
    min-width:125px;
    min-height:58px;
    padding:14px 23px;
    border-radius:999px;
    color:white;
    font-weight:800;
    font-size:17px;
    cursor:pointer;
    transition:transform .15s ease;
}

.btn:active{
    transform:scale(.92);
}

.yes{
    background:linear-gradient(135deg,#ff3d7d,#ff78ad);
    box-shadow:
        0 8px 25px rgba(255,45,115,.35),
        0 0 35px rgba(255,91,151,.2);
    animation:yesPulse 2s ease-in-out infinite;
}

@keyframes yesPulse{
    0%,100%{
        box-shadow:0 8px 25px rgba(255,45,115,.35);
    }
    50%{
        box-shadow:
            0 8px 35px rgba(255,45,115,.65),
            0 0 45px rgba(255,100,170,.3);
    }
}

.no{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.8);
}

.cat-layer{
    position:absolute;
    inset:0;
    z-index:8;
    pointer-events:none;
    overflow:hidden;
}

.cat{
    position:absolute;
    font-size:38px;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.25));
    opacity:.95;
}

.cat:nth-child(1){
    left:-50px;
    top:18%;
    animation:catWalk1 13s linear infinite;
}

.cat:nth-child(2){
    left:75%;
    top:13%;
    animation:catFloat 4s ease-in-out infinite;
}

.cat:nth-child(3){
    left:5%;
    top:65%;
    animation:catFloat 5s ease-in-out infinite;
}

.cat:nth-child(4){
    right:-50px;
    top:48%;
    animation:catWalk2 15s linear infinite;
}

.cat:nth-child(5){
    left:68%;
    bottom:10%;
    animation:catFloat 5.5s ease-in-out infinite;
}

.cat:nth-child(6){
    left:18%;
    bottom:16%;
    animation:catFloat 4.5s ease-in-out infinite;
}

.cat:nth-child(7){
    left:45%;
    top:7%;
    animation:catFloat 6s ease-in-out infinite;
}

.cat:nth-child(8){
    right:10%;
    bottom:25%;
    animation:catFloat 5s ease-in-out infinite;
}

@keyframes catFloat{
    0%,100%{
        transform:translateY(0) rotate(-4deg);
    }
    50%{
        transform:translateY(-15px) rotate(4deg);
    }
}

@keyframes catWalk1{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(calc(100vw + 100px));
    }
}

@keyframes catWalk2{
    from{
        transform:translateX(0) scaleX(-1);
    }
    to{
        transform:translateX(calc(-100vw - 100px)) scaleX(-1);
    }
}

.final{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            #211044 0%,
            #713d69 47%,
            #ee9a9d 73%,
            #f3c69d 100%
        );
}

.sun{
    position:absolute;
    top:14%;
    left:50%;
    transform:translateX(-50%);
    width:150px;
    height:150px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            #fff8cf 0%,
            #ffd28e 45%,
            rgba(255,172,130,.15) 70%,
            transparent 72%
        );
}

.ocean{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:38%;
    background:linear-gradient(
        180deg,
        rgba(50,161,171,.75),
        #126f84
    );
    clip-path:polygon(
        0 20%,
        12% 14%,
        25% 19%,
        40% 11%,
        55% 18%,
        70% 10%,
        84% 17%,
        100% 12%,
        100% 100%,
        0 100%
    );
}

.palm{
    position:absolute;
    bottom:19%;
    width:150px;
    height:270px;
    z-index:2;
}

.palm.left{
    left:-30px;
    transform:rotate(-7deg);
}

.palm.right{
    right:-30px;
    transform:scaleX(-1) rotate(-7deg);
}

.trunk{
    position:absolute;
    bottom:0;
    left:70px;
    width:22px;
    height:220px;
    border-radius:50%;
    background:linear-gradient(
        90deg,
        #704228,
        #a66b38,
        #61341f
    );
    transform:rotate(7deg);
}

.leaves{
    position:absolute;
    top:0;
    left:40px;
    font-size:75px;
    line-height:.55;
}

.final-title{
    position:absolute;
    top:5%;
    width:100%;
    text-align:center;
    z-index:30;
}

.final-title h2{
    margin:0;
    font-family:Georgia,serif;
    font-size:clamp(28px,8vw,44px);
    text-shadow:0 3px 15px rgba(0,0,0,.2);
}

.final-title p{
    margin:8px 0 0;
    color:#ffe3e9;
    font-size:14px;
}

.couple{
    position:absolute;
    left:50%;
    top:27%;
    transform:translateX(-50%);
    width:260px;
    height:300px;
    z-index:20;
}

.person{
    position:absolute;
    bottom:0;
    width:115px;
    height:275px;
}

.prince{
    left:4px;
}

.princess{
    right:4px;
}

.person-head{
    position:absolute;
    top:0;
    left:27px;
    width:65px;
    height:70px;
    border-radius:50%;
    background:#e8a27f;
    z-index:5;
}

.prince .person-head:before{
    content:"";
    position:absolute;
    top:-9px;
    left:-4px;
    width:73px;
    height:39px;
    border-radius:50% 50% 35% 35%;
    background:#3a211b;
}

.princess .person-head:before{
    content:"";
    position:absolute;
    top:-15px;
    left:-14px;
    width:93px;
    height:110px;
    border-radius:50%;
    background:linear-gradient(
        90deg,
        #6f472a,
        #8b5c32,
        #5d391f
    );
    z-index:-1;
}

.eye{
    position:absolute;
    top:32px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#37202b;
}

.eye.one{
    left:18px;
}

.eye.two{
    right:18px;
}

.smile{
    position:absolute;
    top:46px;
    left:27px;
    width:13px;
    height:6px;
    border-bottom:2px solid #743744;
    border-radius:50%;
}

.person-body{
    position:absolute;
    top:68px;
    left:14px;
    width:86px;
    height:115px;
    border-radius:35px 35px 15px 15px;
}

.prince .person-body{
    background:linear-gradient(
        90deg,
        #173c87,
        #4f83d6,
        #19356f
    );
}

.prince .person-body:before{
    content:"";
    position:absolute;
    top:0;
    left:35px;
    width:15px;
    height:110px;
    background:#f5d07a;
}

.princess .person-body{
    top:70px;
    height:130px;
    border-radius:45px 45px 15px 15px;
    background:linear-gradient(
        90deg,
        #b46b96,
        #f1a8c6,
        #a95e8f
    );
    clip-path:polygon(
        35% 0,
        65% 0,
        100% 100%,
        0 100%
    );
}

.arm{
    position:absolute;
    top:82px;
    width:16px;
    height:100px;
    border-radius:20px;
    background:#e6a07d;
    z-index:3;
}

.prince .arm.left{
    left:3px;
    transform:rotate(22deg);
}

.princess .arm.right{
    right:3px;
    transform:rotate(-22deg);
}

.hand{
    position:absolute;
    top:160px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#e7a07d;
    z-index:10;
}

.prince .hand{
    right:0;
}

.princess .hand{
    left:0;
}

.holding{
    position:absolute;
    top:168px;
    left:113px;
    width:35px;
    height:6px;
    border-radius:10px;
    background:#e7a07d;
    z-index:9;
}

.leg{
    position:absolute;
    top:178px;
    width:23px;
    height:96px;
    border-radius:20px;
}

.prince .leg{
    background:#24325d;
}

.princess .leg{
    background:#8d4f79;
}

.leg.one{
    left:30px;
}

.leg.two{
    right:30px;
}

.flower{
    position:absolute;
    top:72px;
    right:19px;
    font-size:23px;
    transform:rotate(-15deg);
}

.fairies{
    position:absolute;
    inset:20% 0 15%;
    z-index:12;
    pointer-events:none;
}

.fairy{
    position:absolute;
    font-size:38px;
    animation:fairyFloat 3s ease-in-out infinite;
    filter:drop-shadow(0 5px 7px rgba(0,0,0,.2));
}

.fairy:nth-child(1){
    left:4%;
    top:15%;
    animation-delay:.2s;
}

.fairy:nth-child(2){
    left:25%;
    top:4%;
    animation-delay:.7s;
}

.fairy:nth-child(3){
    right:25%;
    top:4%;
    animation-delay:1.1s;
}

.fairy:nth-child(4){
    right:4%;
    top:15%;
    animation-delay:1.6s;
}

.fairy:nth-child(5){
    left:2%;
    top:48%;
    animation-delay:.9s;
}

.fairy:nth-child(6){
    right:2%;
    top:48%;
    animation-delay:.4s;
}

.fairy:nth-child(7){
    left:12%;
    bottom:2%;
    animation-delay:1.3s;
}

.fairy:nth-child(8){
    right:12%;
    bottom:2%;
    animation-delay:.6s;
}

@keyframes fairyFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-9px);
    }
}

.message{
    position:absolute;
    bottom:4%;
    left:50%;
    transform:translateX(-50%);
    width:min(88%,390px);
    padding:17px 20px;
    border-radius:25px;
    background:rgba(35,20,55,.45);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    text-align:center;
    z-index:40;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.message strong{
    display:block;
    font-family:Georgia,serif;
    font-size:24px;
}

.message span{
    display:block;
    margin-top:6px;
    color:#ffd2e1;
    font-size:18px;
}

.heart{
    position:fixed;
    left:50%;
    top:50%;
    z-index:100;
    pointer-events:none;
    font-size:25px;
    animation:heartExplosion 1.8s ease-out forwards;
}

@keyframes heartExplosion{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2);
    }

    15%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r))
            scale(1.5);
    }
}

.flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:200;
}

.flash.go{
    animation:flash .8s ease;
}

@keyframes flash{
    0%{opacity:0}
    25%{opacity:.8}
    100%{opacity:0}
}

@media(max-height:700px){

    .intro h1{
        font-size:55px;
    }

    .question-card{
        margin-top:18px;
        padding:20px;
    }

    .couple{
        top:25%;
        transform:translateX(-50%) scale(.85);
    }

    .fairies{
        inset:19% 0 13%;
    }

    .message{
        bottom:2%;
        padding:13px 16px;
    }

    .message strong{
        font-size:21px;
    }
}

@media(max-width:360px){

    .btn{
        min-width:110px;
    }

    .cat{
        font-size:30px;
    }

    .fairy{
        font-size:31px;
    }

    .couple{
        transform:translateX(-50%) scale(.78);
    }
}
</style>
</head>

<body>

<div class="app">

<div class="sky"></div>
<div class="stars"></div>
<div class="moon"></div>

<!-- GATTINI DELLA PRIMA SCHERMATA -->

<div class="cat-layer">

    <div class="cat">🐱</div>
    <div class="cat">🐈</div>

<!-- PRIMA SCHERMATA -->

            </h2>

                anche dall'altra parte del mondo
            </p>

        <div class="fairies">

            <div class="fairy">👸🏻</div>
            <div class="fairy">👸🏼</div>

            <div class="fairy">👸🏼</div>

            <div class="fairy">👸🏽</div>

            <!-- PRINCIPE -->

            <div class="person prince">

                <div class="person-head">

<script>

const yes =
document.getElementById("yes");

const no =
document.getElementById("no");

const start =
document.getElementById("start");

const final =
document.getElementById("final");

const flash =
document.getElementById("flash");

let noAttempts = 0;


/* =====================================================
   PULSANTE NO
===================================================== */

function escapeNo(event){

    if(event){
        event.preventDefault();
    }

    noAttempts++;

    const maxX =
        Math.max(
            20,
            window.innerWidth -
            no.offsetWidth -
            20
        );

    const maxY =
        Math.max(
            20,
            window.innerHeight -
            no.offsetHeight -
            20
        );

    const x =
        20 +
        Math.random() *
        (maxX - 20);

    const y =
        20 +
        Math.random() *
        (maxY - 20);

    no.style.position = "fixed";
    no.style.left = x + "px";
    no.style.top = y + "px";

    const messages = [
        "NO 😈",
        "Sicura? 🥺",
        "Daiii ❤️",
        "Riprova 😂",
        "Non vale 😭",
        "Gaiaaa ❤️",
        "Ti prego 🥹",
        "NOOO 😂"
    ];

    no.textContent =
        messages[
            Math.min(
                noAttempts,
                messages.length - 1
            )
        ];
}


/* Mouse */

no.addEventListener(
    "mouseenter",
    escapeNo
);


/* Touch */

no.addEventListener(
    "touchstart",
    escapeNo,
    {passive:false}
);


/* Click */

no.addEventListener(
    "click",
    escapeNo
);


/* =====================================================
   CUORI
===================================================== */

function createHeart(){

    const heart =
        document.createElement("div");

    heart.className = "heart";

    const symbols = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💘",
        "💞",
        "✨"
    ];

    heart.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];

    heart.style.setProperty(
        "--x",
        (Math.random() * 600 - 300) + "px"
    );

    heart.style.setProperty(
        "--y",
        (-Math.random() * 700 - 100) + "px"
    );

    heart.style.setProperty(
        "--r",
        (Math.random() * 120 - 60) + "deg"
    );

    document.body.appendChild(heart);

    setTimeout(
        () => heart.remove(),
        1900
    );
}


/* =====================================================
   SÌ
===================================================== */

yes.addEventListener(
    "click",
    () => {

        yes.disabled = true;

        for(
            let i = 0;
            i < 75;
            i++
        ){

            setTimeout(
                createHeart,
                i * 18
            );

        }

        flash.classList.add("go");

        setTimeout(
            () => {
                flash.classList.remove("go");
            },
            800
        );

        setTimeout(
            () => {
                start.classList.remove("active");
            },
            250
        );

        setTimeout(
            () => {
                final.classList.add("active");
            },
            650
        );

    }
);


/* =====================================================
   CUORI AUTOMATICI NEL FINALE
===================================================== */

setInterval(
    () => {

        if(
            final.classList.contains("active")
        ){

            if(
                Math.random() > .35
            ){

                createHeart();

            }

        }

    },
    1300
);

</script>
