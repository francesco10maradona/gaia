<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#170d32">

<title>Per Gaia ❤️</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #160c2d;
    color: white;
}

button {
    font: inherit;
}

.app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    opacity: 0;
    visibility: hidden;
    transform: scale(1.04);

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.22,1,.36,1);
}

.screen.active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

/* =========================
   SFONDO
========================= */

.sky {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(255,145,201,.38),
            transparent 34%
        ),
        radial-gradient(
            circle at 15% 70%,
            rgba(116,70,180,.22),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #130a2b 0%,
            #24113d 38%,
            #552657 70%,
            #d96e99 100%
        );
}

.stars {
    position: absolute;
    inset: 0;

    opacity: .85;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.6) 1px,
            transparent 1.5px
        );

    background-size:
        75px 75px,
        125px 125px;

    background-position:
        10px 20px,
        45px 60px;

    animation: starsMove 30s linear infinite;
}

@keyframes starsMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(90px);
    }
}

.moon {
    position: absolute;

    top: 7%;
    right: 8%;

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: #fff2d0;

    box-shadow:
        0 0 25px rgba(255,238,188,.75),
        0 0 75px rgba(255,200,220,.22);
}

.moon::after {
    content: "";

    position: absolute;

    width: 63px;
    height: 63px;

    left: 18px;
    top: -5px;

    border-radius: 50%;

    background: #1b0d35;
}

/* =========================
   GATTINI
========================= */

.cat-layer {
    position: absolute;
    inset: 0;

    z-index: 12;

    pointer-events: none;
    overflow: hidden;
}

.cat {
    position: absolute;

    font-size: 38px;

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.25)
        );

    opacity: .96;
}

.cat1 {
    left: -60px;
    top: 18%;

    animation:
        catWalkRight
        14s
        linear
        infinite;
}

.cat2 {
    right: -60px;
    top: 33%;

    animation:
        catWalkLeft
        17s
        linear
        infinite;
}

.cat3 {
    left: 7%;
    top: 67%;

    animation:
        catFloat
        4s
        ease-in-out
        infinite;
}

.cat4 {
    right: 8%;
    top: 12%;

    animation:
        catFloat
        5s
        ease-in-out
        infinite;
}

.cat5 {
    left: 18%;
    bottom: 10%;

    animation:
        catFloat
        4.5s
        ease-in-out
        infinite;
}

.cat6 {
    right: 18%;
    bottom: 17%;

    animation:
        catFloat
        5.5s
        ease-in-out
        infinite;
}

.cat7 {
    left: 44%;
    top: 8%;

    animation:
        catFloat
        6s
        ease-in-out
        infinite;
}

@keyframes catWalkRight {
    from {
        transform: translateX(0);
    }

    to {
        transform:
            translateX(
                calc(100vw + 140px)
            );
    }
}

@keyframes catWalkLeft {
    from {
        transform:
            translateX(0)
            scaleX(-1);
    }

    to {
        transform:
            translateX(
                calc(-100vw - 140px)
            )
            scaleX(-1);
    }
}

@keyframes catFloat {
    0%, 100% {
        transform:
            translateY(0)
            rotate(-4deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(4deg);
    }
}

/* =========================
   INTRO
========================= */

.intro {
    position: relative;
    z-index: 30;

    width: min(100%, 430px);

    text-align: center;
}

.crown-intro {
    font-size: 48px;

    animation:
        crownFloat
        3s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 5px 15px
            rgba(255,180,220,.4)
        );
}

@keyframes crownFloat {
    0%, 100% {
        transform:
            translateY(0)
            rotate(-3deg);
    }

    50% {
        transform:
            translateY(-10px)
            rotate(3deg);
    }
}

.intro h1 {
    margin: 10px 0 0;

    font-family: Georgia, serif;

    font-size:
        clamp(
            58px,
            17vw,
            82px
        );

    line-height: .9;

    letter-spacing: -4px;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.25);
}

.intro h1 span {
    color: #ff83b5;
}

.question-card {
    width: min(100%, 370px);

    margin: 30px auto 0;

    padding: 27px 20px;

    border-radius: 32px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.25),

        inset
        0 1px
        rgba(255,255,255,.15);
}

.question {
    font-family: Georgia, serif;
    font-size: 31px;
}

.question-sub {
    margin-top: 9px;

    color:
        rgba(255,255,255,.68);

    font-size: 14px;
    line-height: 1.4;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 14px;

    margin-top: 25px;
}

.btn {
    min-width: 125px;
    min-height: 58px;

    padding: 14px 22px;

    border: 0;
    border-radius: 999px;

    color: white;

    font-size: 17px;
    font-weight: 800;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    transition:
        transform .18s ease;
}

.btn:active {
    transform: scale(.92);
}

.yes {
    background:
        linear-gradient(
            135deg,
            #ff397d,
            #ff79ad
        );

    box-shadow:
        0 8px 28px
        rgba(255,45,115,.4);

    animation:
        yesPulse
        2s
        ease-in-out
        infinite;
}

@keyframes yesPulse {
    0%, 100% {
        box-shadow:
            0 8px 28px
            rgba(255,45,115,.35);
    }

    50% {
        box-shadow:
            0 8px 38px
            rgba(255,45,115,.7);
    }
}

.no {
    position: relative;

    z-index: 100;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.2);

    color:
        rgba(255,255,255,.88);

    touch-action: none;

    white-space: nowrap;

    transition:
        left .16s ease,
        top .16s ease,
        transform .16s ease;
}

/* =========================
   FINALE
========================= */

.final {
    position: absolute;
    inset: 0;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #1c0d3d 0%,
            #633565 42%,
            #e9899b 67%,
            #f6c696 100%
        );
}

.sun {
    position: absolute;

    top: 13%;
    left: 50%;

    transform:
        translateX(-50%);

    width: 155px;
    height: 155px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffbd9 0%,
            #ffd18c 45%,
            rgba(255,180,130,.15) 70%,
            transparent 72%
        );
}

.ocean {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 39%;

    background:
        linear-gradient(
            180deg,
            rgba(48,163,174,.8),
            #126e83
        );

    clip-path:
        polygon(
            0 20%,
            12% 14%,
            25% 19%,
            40% 11%,
            55% 18%,
            70% 10%,
            84% 17%,
            100% 12%,
            100% 100%,
            0 100%
        );
}

.palm {
    position: absolute;

    bottom: 18%;

    width: 150px;
    height: 270px;

    z-index: 4;
}

.palm.left {
    left: -30px;

    transform:
        rotate(-7deg);
}

.palm.right {
    right: -30px;

    transform:
        scaleX(-1)
        rotate(-7deg);
}

.trunk {
    position: absolute;

    bottom: 0;
    left: 70px;

    width: 22px;
    height: 220px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            #704228,
            #a66b38,
            #61341f
        );

    transform:
        rotate(7deg);
}

.leaves {
    position: absolute;

    top: 0;
    left: 40px;

    font-size: 75px;

    line-height: .55;
}

.final-title {
    position: absolute;

    top: 5%;

    width: 100%;

    z-index: 30;

    text-align: center;
}

.final-title h2 {
    margin: 0;

    padding: 0 15px;

    font-family: Georgia, serif;

    font-size:
        clamp(
            28px,
            8vw,
            44px
        );

    line-height: 1.05;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,.25);
}

.final-title p {
    margin: 9px 0 0;

    color: #ffe1ea;

    font-size: 14px;
}

/* =========================
   COPPIA
========================= */

.couple {
    position: absolute;

    left: 50%;
    top: 27%;

    width: 280px;
    height: 310px;

    transform:
        translateX(-50%);

    z-index: 25;
}

.person {
    position: absolute;

    bottom: 0;

    width: 120px;
    height: 280px;
}

.prince {
    left: 3px;
}

.princess {
    right: 3px;
}

/* =========================
   PRINCIPE
========================= */

.prince .person-head {
    position: absolute;

    top: 0;
    left: 27px;

    width: 67px;
    height: 75px;

    border-radius:
        48%
        48%
        44%
        44%;

    background:
        linear-gradient(
            135deg,
            #f0b18d,
            #df916e
        );

    z-index: 5;
}

.prince .person-head::before {
    content: "";

    position: absolute;

    top: -10px;
    left: -4px;

    width: 76px;
    height: 42px;

    border-radius:
        55%
        55%
        30%
        30%;

    background:
        linear-gradient(
            135deg,
            #2d1a18,
            #55301f,
            #241513
        );

    z-index: -1;
}

.prince .eye {
    position: absolute;

    top: 35px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #30202a;
}

.prince .eye.one {
    left: 17px;
}

.prince .eye.two {
    right: 17px;
}

.prince .smile {
    position: absolute;

    top: 52px;
    left: 27px;

    width: 14px;
    height: 6px;

    border-bottom:
        2px solid #773b45;

    border-radius: 50%;
}

.prince .person-body {
    position: absolute;

    top: 72px;
    left: 16px;

    width: 88px;
    height: 118px;

    border-radius:
        34px
        34px
        13px
        13px;

    background:
        linear-gradient(
            90deg,
            #183878,
            #4f83d5,
            #18336e
        );
}

.prince .person-body::before {
    content: "";

    position: absolute;

    top: 0;
    left: 36px;

    width: 16px;
    height: 113px;

    background: #f2cf79;
}

.prince .arm {
    position: absolute;

    top: 88px;

    width: 17px;
    height: 99px;

    border-radius: 20px;

    background: #e4a07c;

    z-index: 6;
}

.prince .arm.left {
    left: 3px;

    transform:
        rotate(22deg);
}

.prince .hand {
    position: absolute;

    right: 0;
    top: 164px;

    width: 23px;
    height: 23px;

    border-radius: 50%;

    background: #e4a07c;

    z-index: 15;
}

.prince .leg {
    position: absolute;

    top: 184px;

    width: 24px;
    height: 96px;

    border-radius: 20px;

    background: #25315b;
}

.prince .leg.one {
    left: 30px;
}

.prince .leg.two {
    right: 30px;
}

/* =========================
   PRINCIPESSA
========================= */

.princess .person-head {
    position: absolute;

    top: 0;
    left: 25px;

    width: 70px;
    height: 79px;

    border-radius:
        48%
        48%
        45%
        45%;

    background:
        linear-gradient(
            135deg,
            #f7c1a1,
            #e8a07e
        );

    z-index: 8;
}

.princess .person-head::before {
    content: "";

    position: absolute;

    top: -19px;
    left: -18px;

    width: 106px;
    height: 115px;

    border-radius:
        52%
        52%
        42%
        42%;

    background:
        linear-gradient(
            100deg,
            #5b351f,
            #80502d 45%,
            #663c21
        );

    z-index: -1;
}

.princess .person-head::after {
    content: "";

    position: absolute;

    left: -21px;
    top: 32px;

    width: 112px;
    height: 88px;

    border-radius: 45%;

    border-left:
        14px solid #704522;

    border-right:
        14px solid #704522;

    z-index: -1;
}

.princess .eye {
    position: absolute;

    top: 34px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #38202a;

    box-shadow:
        0 1px 0
        rgba(255,255,255,.8);
}

.princess .eye.one {
    left: 17px;
}

.princess .eye.two {
    right: 17px;
}

.princess .eye::after {
    content: "";

    position: absolute;

    top: -4px;

    width: 10px;
    height: 4px;

    border-top:
        2px solid #3a2023;
}

.princess .eye.one::after {
    left: -2px;

    transform:
        rotate(-15deg);
}

.princess .eye.two::after {
    right: -2px;

    transform:
        rotate(15deg);
}

.princess .smile {
    position: absolute;

    top: 52px;
    left: 27px;

    width: 16px;
    height: 7px;

    border-bottom:
        2px solid #a94f68;

    border-radius:
        0 0 50% 50%;
}

.princess .mini-crown {
    position: absolute;

    top: -31px;
    left: 13px;

    font-size: 27px;

    z-index: 30;
}

.princess .person-body {
    position: absolute;

    top: 74px;
    left: 9px;

    width: 100px;
    height: 142px;

    border-radius:
        43px
        43px
        12px
        12px;

    background:
        linear-gradient(
            90deg,
            #a45b87,
            #e8a5c4 48%,
            #9b527d
        );

    clip-path:
        polygon(
            34% 0,
            66% 0,
            100% 100%,
            0 100%
        );

    box-shadow:
        0 8px 15px
        rgba(80,25,70,.18);
}

.princess .person-body::before {
    content: "";

    position: absolute;

    top: -5px;
    left: 38px;

    width: 18px;
    height: 16px;

    background: #e8a07d;

    border-radius: 5px;
}

.princess .person-body::after {
    content: "";

    position: absolute;

    left: 45px;
    top: 0;

    width: 8px;
    height: 134px;

    background:
        rgba(255,255,255,.27);

    transform:
        skewX(-5deg);
}

.princess .arm {
    position: absolute;

    top: 88px;
    right: 0;

    width: 17px;
    height: 101px;

    border-radius: 20px;

    background: #e6a07d;

    z-index: 8;

    transform:
        rotate(-24deg);
}

.princess .hand {
    position: absolute;

    left: -1px;
    top: 164px;

    width: 23px;
    height: 23px;

    border-radius: 50%;

    background: #e7a07d;

    z-index: 18;
}

.princess .flower {
    position: absolute;

    top: 1px;
    left: 79px;

    font-size: 22px;

    z-index: 35;

    transform:
        rotate(-15deg);
}

.princess .leg {
    position: absolute;

    top: 189px;

    width: 24px;
    height: 91px;

    border-radius: 20px;

    background: #8d4f79;
}

.princess .leg.one {
    left: 31px;
}

.princess .leg.two {
    right: 31px;
}

.holding {
    position: absolute;

    top: 171px;
    left: 120px;

    width: 36px;
    height: 7px;

    border-radius: 10px;

    background: #e7a07d;

    z-index: 16;
}

/* =========================
   PRINCIPESSE INTORNO
========================= */

.fairies {
    position: absolute;

    inset: 20% 0 14%;

    z-index: 13;

    pointer-events: none;
}

.fairy {
    position: absolute;

    font-size: 38px;

    filter:
        drop-shadow(
            0 5px 7px
            rgba(0,0,0,.22)
        );

    animation:
        fairyFloat
        3.5s
        ease-in-out
        infinite;
}

.fairy:nth-child(1) {
    left: 4%;
    top: 15%;
}

.fairy:nth-child(2) {
    left: 25%;
    top: 4%;
    animation-delay: .6s;
}

.fairy:nth-child(3) {
    right: 25%;
    top: 4%;
    animation-delay: 1s;
}

.fairy:nth-child(4) {
    right: 4%;
    top: 15%;
    animation-delay: 1.5s;
}

.fairy:nth-child(5) {
    left: 2%;
    top: 48%;
    animation-delay: .8s;
}

.fairy:nth-child(6) {
    right: 2%;
    top: 48%;
    animation-delay: .3s;
}

.fairy:nth-child(7) {
    left: 12%;
    bottom: 2%;
    animation-delay: 1.2s;
}

.fairy:nth-child(8) {
    right: 12%;
    bottom: 2%;
    animation-delay: .5s;
}

@keyframes fairyFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

/* =========================
   MESSAGGIO
========================= */

.message {
    position: absolute;

    left: 50%;
    bottom: 4%;

    transform:
        translateX(-50%);

    width: min(88%, 390px);

    padding:
        17px 20px;

    border-radius: 25px;

    background:
        rgba(35,20,55,.48);

    border:
        1px solid
        rgba(255,255,255,.2);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    text-align: center;

    z-index: 40;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.2);
}

.message strong {
    display: block;

    font-family: Georgia, serif;

    font-size: 24px;
}

.message span {
    display: block;

    margin-top: 6px;

    color: #ffd2e1;

    font-size: 18px;
}

/* =========================
   CUORI
========================= */

.heart {
    position: fixed;

    left: 50%;
    top: 50%;

    z-index: 200;

    pointer-events: none;

    font-size: 25px;

    animation:
        heartExplosion
        1.8s
        ease-out
        forwards;
}

@keyframes heartExplosion {
    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r))
            scale(1.5);
    }
}

.flash {
    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 500;
}

.flash.go {
    animation:
        flash
        .8s
        ease;
}

@keyframes flash {
    0% {
        opacity: 0;
    }

    25% {
        opacity: .8;
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-height: 700px) {

    .intro h1 {
        font-size: 56px;
    }

    .question-card {
        margin-top: 18px;
        padding: 21px;
    }

    .couple {
        top: 25%;

        transform:
            translateX(-50%)
            scale(.86);
    }

    .message {
        bottom: 2%;
        padding: 13px 16px;
    }

    .message strong {
        font-size: 21px;
    }
}

@media (max-width: 360px) {

    .btn {
        min-width: 110px;
    }

    .cat {
        font-size: 30px;
    }

    .fairy {
        font-size: 31px;
    }

    .couple {
        transform:
            translateX(-50%)
            scale(.78);
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="sky"></div>
    <div class="stars"></div>
    <div class="moon"></div>

    <!-- GATTINI -->

    <div class="cat-layer">

        <div class="cat cat1">🐱</div>

<script>

/* =========================================================
   COLLEGAMENTO GOOGLE APPS SCRIPT
========================================================= */

const TRACKING_URL =
    "https://script.google.com/macros/s/AKfycbwyEZmVVyPM4Hyf--70oShW_L7Svwf8SiyHGxWh34FaFf0Tx8rORyEj7fwpR-Stc3uw/exec";


/* =========================================================
   IDENTIFICATIVO VISITA
========================================================= */

const visitId =
    Date.now().toString(36) +
    Math.random()
        .toString(36)
        .substring(2);


/* =========================================================
   INVIO EVENTI
========================================================= */

function trackEvent(eventName) {

    const data = {

        event: eventName,

        visitId: visitId,

        timestamp:
            new Date().toISOString(),

        page:
            window.location.href

    };


    try {

        const blob =
            new Blob(
                [JSON.stringify(data)],
                {
                    type:
                        "text/plain;charset=UTF-8"
                }
            );

        navigator.sendBeacon(
            TRACKING_URL,
            blob
        );

    } catch (error) {

        fetch(
            TRACKING_URL,
            {
                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "text/plain;charset=UTF-8"
                },

                body:
                    JSON.stringify(data),

                keepalive: true
            }
        ).catch(
            () => {}
        );

    }

}


/* =========================================================
   ELEMENTI
========================================================= */

const yes =
    document.getElementById("yes");

const no =
    document.getElementById("no");

const start =
    document.getElementById("start");

const final =
    document.getElementById("final");

const flash =
    document.getElementById("flash");


let noAttempts = 0;


/* =========================================================
   NO
========================================================= */

function escapeNo(event) {

    if (event) {

        event.preventDefault();
        event.stopPropagation();

    }


    /*
       REGISTRA OGNI TENTATIVO
    */

    noAttempts++;

    trackEvent("NO");


    const buttonWidth =
        no.offsetWidth || 125;

    const buttonHeight =
        no.offsetHeight || 58;

    const margin = 12;


    const maxX =
        Math.max(
            margin,
            window.innerWidth -
            buttonWidth -
            margin
        );


    const maxY =
        Math.max(
            margin,
            window.innerHeight -
            buttonHeight -
            margin
        );


    const x =
        margin +
        Math.random() *
        Math.max(
            1,
            maxX - margin
        );


    const y =
        margin +
        Math.random() *
        Math.max(
            1,
            maxY - margin
        );


    no.style.position =
        "fixed";

    no.style.left =
        x + "px";

    no.style.top =
        y + "px";


    const rotation =
        Math.random() * 24 - 12;


    no.style.transform =
        "rotate(" +
        rotation +
        "deg)";


    const messages = [

        "NO 😈",
        "Sicura? 🥺",
        "Dai Gaia ❤️",
        "Quasi! 😂",
        "Riprova 😈",
        "Non mi prendi 😂",
        "AHAHAHA ❤️",
        "Daiii 🥹",
        "No no 😈",
        "Continua a provare 😂",
        "Non scappo... forse 👀",
        "Ti amo comunque ❤️",
        "Ancora?! 😂",
        "Mai! 😈",
        "Prendimi se ci riesci 🏃‍♂️",
        "Gaiaaaa ❤️",
        "🥹❤️",
        "NOOO 😂",
        "Sei vicina!",
        "Ops... 😈"

    ];


    no.textContent =
        messages[
            noAttempts %
            messages.length
        ];

}


/* =========================================================
   MOUSE
========================================================= */

no.addEventListener(
    "mouseenter",
    escapeNo
);


/* =========================================================
   TOUCH
========================================================= */

no.addEventListener(
    "touchstart",
    escapeNo,
    {
        passive: false
    }
);


/* =========================================================
   CLICK
========================================================= */

no.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        escapeNo(event);

        return false;

    }
);


/* =========================================================
   CUORI
========================================================= */

function createHeart() {

    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    const symbols = [

        "❤️",
        "💕",
        "💗",
        "💖",
        "💘",
        "💞",
        "✨"

    ];


    heart.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    heart.style.setProperty(
        "--x",
        (
            Math.random() * 600 -
            300
        ) + "px"
    );


    heart.style.setProperty(
        "--y",
        (
            -Math.random() * 700 -
            100
        ) + "px"
    );


    heart.style.setProperty(
        "--r",
        (
            Math.random() * 120 -
            60
        ) + "deg"
    );


    document.body.appendChild(
        heart
    );


    setTimeout(
        function() {
            heart.remove();
        },
        1900
    );

}


/* =========================================================
   SI
========================================================= */

yes.addEventListener(
    "click",
    function() {

        /*
           REGISTRA IL SI
        */

        trackEvent("SI");


        yes.disabled = true;


        /*
           ESPLOSIONE DI CUORI
        */

        for (
            let i = 0;
            i < 75;
            i++
        ) {

            setTimeout(
                createHeart,
                i * 18
            );

        }


        flash.classList.add(
            "go"
        );


        setTimeout(
            function() {

                flash.classList.remove(
                    "go"
                );

            },
            800
        );


        start.classList.remove(
            "active"
        );


        setTimeout(
            function() {

                final.classList.add(
                    "active"
                );

            },
            650
        );

    }
);


/* =========================================================
   CUORI AUTOMATICI
========================================================= */

setInterval(
    function() {

        if (
            final.classList.contains(
                "active"
            )
        ) {

            if (
                Math.random() > .35
            ) {

                createHeart();

            }

        }

    },
    1300
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            no.style.position === "fixed"
        ) {

            const rect =
                no.getBoundingClientRect();


            const margin = 12;


            let x =
                rect.left;

            let y =
                rect.top;


            if (
                x + rect.width >
                window.innerWidth -
                margin
            ) {

                x =
                    window.innerWidth -
                    rect.width -
                    margin;

            }


            if (
                y + rect.height >
                window.innerHeight -
                margin
            ) {

                y =
                    window.innerHeight -
                    rect.height -
                    margin;

            }


            if (x < margin) {
                x = margin;
            }


            if (y < margin) {
                y = margin;
            }


            no.style.left =
                x + "px";

            no.style.top =
                y + "px";

        }

    }
);

</script>
